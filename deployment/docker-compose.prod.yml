# =============================================================================
# Production override: no source mounts, no reload, proxy-fronted ingress
#
#   docker compose -f deployment/docker-compose.yml \
#                  -f deployment/docker-compose.prod.yml up -d
# =============================================================================

services:
  postgres:
    restart: always

  redis:
    restart: always

  backend:
    restart: always
    command:
      ['uvicorn', 'app.main:app', '--host', '0.0.0.0', '--port', '8000', '--workers', '4']
    environment:
      ENVIRONMENT: production
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    # Not published to the host: all ingress is terminated by the proxy.
    expose:
      - '8000'

  frontend:
    restart: always
    environment:
      # Server-side (Next.js process) URL: the backend's Compose service name.
      # See docker-compose.dev.yml for why this differs from NEXT_PUBLIC_API_URL.
      API_INTERNAL_URL: http://backend:8000
    expose:
      - '3000'

  proxy:
    image: nginx:1.27-alpine
    restart: always
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./proxy/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./proxy/proxy_params.conf:/etc/nginx/proxy_params.conf:ro
      - ./proxy/certs:/etc/nginx/certs:ro
    depends_on:
      backend:
        condition: service_started
      frontend:
        condition: service_started
    healthcheck:
      test: ['CMD', 'wget', '--quiet', '--spider', 'http://127.0.0.1/healthz']
      interval: 30s
      timeout: 5s
      retries: 3
