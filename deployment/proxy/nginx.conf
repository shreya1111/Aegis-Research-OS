# =============================================================================
# Reverse proxy: TLS termination, security headers, coarse rate limiting
# (design §9.4, §11.3)
#
# Place `fullchain.pem` and `privkey.pem` in ./proxy/certs before starting the
# production stack.
# =============================================================================

user nginx;
worker_processes auto;

error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format json_combined escape=json
        '{"timestamp":"$time_iso8601","remote_addr":"$remote_addr",'
        '"method":"$request_method","path":"$uri","status":$status,'
        '"duration_ms":$request_time,"request_id":"$http_x_request_id",'
        '"bytes_sent":$body_bytes_sent}';

    access_log /var/log/nginx/access.log json_combined;

    sendfile on;
    tcp_nopush on;
    server_tokens off;
    keepalive_timeout 65;

    # Long agent runs stream for up to two minutes (design NFR-P2).
    proxy_read_timeout 180s;
    proxy_send_timeout 180s;
    client_max_body_size 100m;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;

    # Coarse protection ahead of the application's own Redis-backed limits.
    limit_req_zone $binary_remote_addr zone=general:10m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=auth:10m rate=1r/s;

    upstream backend_upstream {
        server backend:8000;
    }

    upstream frontend_upstream {
        server frontend:3000;
    }

    # ---- HTTP: proxy health, redirect everything else to HTTPS ----
    server {
        listen 80;
        server_name _;

        location /healthz {
            access_log off;
            return 200 "ok\n";
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ---- HTTPS ----
    server {
        listen 443 ssl;
        http2 on;
        server_name _;

        ssl_certificate /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;

        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;

        location /healthz {
            access_log off;
            return 200 "ok\n";
        }

        location /health {
            proxy_pass http://backend_upstream;
            include /etc/nginx/proxy_params.conf;
        }

        location ~ ^/api/v1/auth/ {
            limit_req zone=auth burst=5 nodelay;
            proxy_pass http://backend_upstream;
            include /etc/nginx/proxy_params.conf;
        }

        location /api/ {
            limit_req zone=general burst=60 nodelay;
            proxy_pass http://backend_upstream;
            include /etc/nginx/proxy_params.conf;
            # Streamed answers and trace events must not be buffered.
            proxy_buffering off;
            proxy_cache off;
        }

        location / {
            proxy_pass http://frontend_upstream;
            include /etc/nginx/proxy_params.conf;
        }
    }
}
